name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # version을 비워 두면 package.json의 packageManager(pnpm@12.15.0)를 읽는다
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8

      - name: 함수 타입 검사
        working-directory: backend/supabase/functions/api
        run: deno check index.ts

      # 함수 폴더에서 실행해야 함수의 deno.json을 읽어 실제 Edge Function과 같은 설정으로 shared를 검사한다.
      # shared 폴더에서 실행하면 확장자 없는 import를 잡지 못하므로 위치를 바꾸지 않는다.
      # (docs/decisions/0001-edge-function-shared-import.md)
      - name: shared Deno 호환 검사 (확장자 없는 import 잡기)
        working-directory: backend/supabase/functions/api
        run: deno check ../../../../shared/src/index.ts
